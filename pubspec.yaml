name: mini_erp
description: MG Chemicals -- Product, Sales, Purchase & Accounting (Flutter frontend)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  file_picker: ^12.2.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  pdf: ^3.13.0
  printing: ^5.15.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/mg_logo.png

  # Source Serif 4 (SIL Open Font License 1.1) -- the display face behind
  # AppText.serif in lib/theme/app_theme.dart. Bundled rather than named
  # as a system font because Flutter Web renders through CanvasKit, which
  # cannot reach the host's installed fonts: a system-font fallback there
  # degrades silently to the default sans.
  fonts:
    - family: SourceSerif
      fonts:
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
